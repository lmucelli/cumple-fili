<!doctype html><html><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Filipa | 15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#334;font-family:Montserrat}
.hero{height:100vh;background:linear-gradient(rgba(20,40,25,.35),rgba(20,40,25,.35)),url('https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=1600&auto=format&fit=crop') center/cover;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff}
.card{background:rgba(255,255,255,.12);backdrop-filter:blur(10px);padding:40px;border:1px solid rgba(255,255,255,.3)}
h1{font-family:"Cormorant Garamond";font-size:82px;font-weight:500;margin:0}
h2{font-family:"Cormorant Garamond";font-size:44px;font-weight:400}
#c{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:25px 0}.b{min-width:90px}.n{font-size:42px;font-family:"Cormorant Garamond"}
section{padding:80px 20px;text-align:center}.btn{display:inline-block;padding:14px 28px;border:1px solid #556b5d;color:#556b5d;text-decoration:none;border-radius:40px;margin:8px}
</style></head><body>
<div class=hero><div class=card><div>26 SEPTIEMBRE 2026</div><h1>Filipa</h1><h2>La fiesta ya empezó en...</h2><div id=c></div></div></div>
<section><h2>Sábado · 26 · Septiembre</h2><p>21:00 hs</p></section>
<section><h2>Salón Calle 13</h2><a class=btn href='https://maps.app.goo.gl/dXh2HciXFDjbbEKAA'>Cómo llegar</a></section>
<section><h2>Dress Code</h2><p>SPORT</p><p>Evitar los colores <b>Nude</b> y <b>Dorado</b></p></section>
<section><a class=btn href='#'>Confirmar asistencia</a><a class=btn href='#'>Regalos</a></section>
<script>
const t=new Date("2026-09-26T21:00:00-03:00");
setInterval(()=>{let d=t-new Date();if(d<0){c.innerHTML="<h2>¡La fiesta comenzó!</h2>";return}
let s=d/1000|0,D=s/86400|0,H=s%86400/3600|0,M=s%3600/60|0,S=s%60;
c.innerHTML=`<div class=b><div class=n>${D}</div>Días</div><div class=b><div class=n>${H}</div>Horas</div><div class=b><div class=n>${M}</div>Min</div><div class=b><div class=n>${S}</div>Seg</div>`},1000)
</script></body></html>
